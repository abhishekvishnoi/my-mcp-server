# Configure the Data Source type as H2
quarkus.datasource.db-kind=h2

# URL for the In-Memory DB (Keeps data alive even after last connection closes)
quarkus.datasource.jdbc.url=jdbc:h2:mem:my_inmemory_db;DB_CLOSE_DELAY=-1

# Database Credentials
quarkus.datasource.username=sa
quarkus.datasource.password=

# Drop and recreate schema on application startup
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.mcp.server.auto-ping-interval=10s
